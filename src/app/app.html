<div class="min-h-screen flex flex-col bg-white dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-200">
  
  <!-- Global Reading Progress Bar -->
  <app-reading-progress-bar />

  <!-- Global Header -->
  <app-header 
    (openSearch)="openSearchModal()" 
    (openWhatsApp)="openWhatsAppModal()" />

  <!-- Main View Container -->
  <div class="flex-1 w-full">
    <router-outlet />
  </div>

  <!-- Global Footer -->
  <app-footer 
    (openWhatsApp)="openWhatsAppModal()" />
  <!-- Modals -->
  @if (isWhatsAppModalOpen()) {
    <app-whatsapp-modal 
      (closeModal)="closeWhatsAppModal()" />
  }

  @if (isSearchModalOpen()) {
    <app-search-modal 
      (closeModal)="closeSearchModal()" />
  }

</div>
