<div class="logo-wrapper" [class]="containerClass()">
  <img
    class="logo-img"
    [src]="logoSrc()"
    [style.height.px]="size()"
    [alt]="'Centre Dentaire Dali'"
    (error)="onImageError()"
    [hidden]="hasImageError()"
  />
  @if (hasImageError()) {
    <span class="logo-fallback-label" [style.fontSize.px]="size() * 0.48">CDD</span>
  }
  @if (showText()) {
    <span class="logo-fallback-copy">
      <span class="logo-brand-name"><span class="logo-brand-prefix">C.D.</span><span class="logo-brand-surname">Dali</span></span>
      @if (showSubtitle()) {
        <span class="logo-fallback-subtitle">Centre Dentaire Dali</span>
      }
    </span>
  }
</div>
