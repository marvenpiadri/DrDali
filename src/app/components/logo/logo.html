<div class="logo-wrapper" [class]="containerClass()">
  @if (!hasImageError()) {
    <img 
      [src]="logoSrc()" 
      alt="Centre Dentaire Dali" 
      class="logo-img"
      [style.height.px]="size()"
      (error)="onImageError()" />
  }

  @if (showText()) {
    @if (!hasTextError()) {
      <img 
        [src]="logoTextSrc()" 
        alt="Centre Dentaire Dali" 
        class="logo-text-img"
        [style.height.px]="textHeight()"
        (error)="onTextError()" />
    } @else {
      <div class="logo-fallback-copy">
        <span class="logo-fallback-label">
          CENTRE
        </span>
        <span class="logo-fallback-label">
          DENTAIRE
        </span>
        <span class="logo-fallback-brand">
          DALI
        </span>
        @if (showSubtitle()) {
          <span class="logo-fallback-subtitle">
            {{ i18n.translate('brandTagline') }}
          </span>
        }
      </div>
    }
  }
</div>
