<div class="compact-preview-card flex flex-col w-full bg-neutral-950 text-white rounded-2xl border border-neutral-800 shadow-xl overflow-hidden relative font-sans">
  
  <!-- PREVIEW HEADER -->
  <div class="flex items-center justify-between px-4 py-3 bg-neutral-900/90 border-b border-neutral-800 shrink-0 gap-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="min-w-0">
        <h4 class="text-xs sm:text-sm font-bold text-white truncate">
          {{ localizedToothName() }}
        </h4>
        <p class="text-[10px] text-neutral-400 truncate">
          {{ localizedArchName() }}
        </p>
      </div>
    </div>
  </div>

  <!-- TOOTH TYPES SELECTOR BAR (Incisives, Canines, Prémolaires, Molaires) -->
  <div class="px-3 py-2 bg-neutral-900/60 border-b border-neutral-800/80 flex items-center justify-between gap-1 overflow-x-auto no-scrollbar">
    @for (preset of toothTypePresets; track preset.id) {
      <button
        type="button"
        (click)="selectTooth(preset.fdi)"
        class="flex-1 py-1 px-2 rounded-lg text-[11px] font-semibold transition cursor-pointer text-center whitespace-nowrap border"
        [class.bg-white]="currentFdi() === preset.fdi"
        [class.text-neutral-950]="currentFdi() === preset.fdi"
        [class.border-white]="currentFdi() === preset.fdi"
        [class.bg-neutral-800/50]="currentFdi() !== preset.fdi"
        [class.text-neutral-400]="currentFdi() !== preset.fdi"
        [class.border-neutral-700/60]="currentFdi() !== preset.fdi"
        [class.hover:text-white]="currentFdi() !== preset.fdi">
        {{ i18n.translate(preset.labelKey) }}
      </button>
    }
  </div>

  <!-- 3D VIEWPORT CONTAINER -->
  <div class="relative w-full aspect-square sm:aspect-[4/3] bg-radial from-neutral-900 to-neutral-950 overflow-hidden">
    
    <app-dental-3d-viewport
      #viewport
      modelType="tooth-explorer"
      [activeMode]="activeMode()"
      [selectedToothFdi]="currentFdi()"
      [showControls]="false"
      class="w-full h-full block">
    </app-dental-3d-viewport>

    <!-- Small rounded buttons in bottom right -->
    <div class="absolute bottom-3 right-3 rtl:right-auto rtl:left-3 flex items-center gap-1.5 z-20">
      <button
        type="button"
        (click)="toggleAutoRotate()"
        [class.bg-emerald-500/30]="isAutoRotating()"
        [class.text-emerald-400]="isAutoRotating()"
        [class.border-emerald-500/50]="isAutoRotating()"
        [class.bg-neutral-900/90]="!isAutoRotating()"
        [class.text-neutral-300]="!isAutoRotating()"
        class="p-1.5 rounded-full border border-neutral-700/80 hover:text-white hover:bg-neutral-800 transition cursor-pointer backdrop-blur shadow-sm flex items-center justify-center"
        [title]="i18n.translate('autoRotateToggle')">
        <mat-icon class="text-sm leading-none flex items-center justify-center">rotate_right</mat-icon>
      </button>

      <button
        type="button"
        (click)="resetCamera()"
        class="p-1.5 rounded-full bg-neutral-900/90 text-neutral-300 border border-neutral-700/80 hover:text-white hover:bg-neutral-800 transition cursor-pointer backdrop-blur shadow-sm flex items-center justify-center"
        [title]="i18n.translate('recenterView')">
        <mat-icon class="text-sm leading-none flex items-center justify-center">center_focus_strong</mat-icon>
      </button>
    </div>

  </div>

  <!-- VIEWING MODE TOGGLE BUTTONS -->
  <div class="px-3 py-2 bg-neutral-900/60 border-t border-neutral-800/80 flex items-center justify-center gap-1.5">
    @for (mode of viewModes; track mode.id) {
      <button
        type="button"
        (click)="setViewMode(mode.id)"
        class="px-3 py-1 rounded-lg text-[11px] font-semibold transition cursor-pointer border uppercase tracking-wider"
        [class.bg-white]="activeMode() === mode.id"
        [class.text-neutral-950]="activeMode() === mode.id"
        [class.border-white]="activeMode() === mode.id"
        [class.bg-neutral-800/40]="activeMode() !== mode.id"
        [class.text-neutral-400]="activeMode() !== mode.id"
        [class.border-neutral-700/60]="activeMode() !== mode.id"
        [class.hover:text-white]="activeMode() !== mode.id">
        {{ mode.label }}
      </button>
    }
  </div>

  <!-- FOOTER / CTA -->
  @if (showDetailsCta()) {
    <div class="px-4 py-3 bg-neutral-900/90 border-t border-neutral-800 flex items-center justify-between gap-3">
      <div class="text-[11px] text-neutral-400 hidden sm:block">
        {{ i18n.translate('atlasTitle') }}
      </div>

      <a
        [routerLink]="ctaLink()"
        [queryParams]="{ fdi: currentFdi(), tooth: currentFdi() }"
        class="inline-flex items-center justify-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white text-neutral-950 hover:bg-neutral-200 text-xs font-bold transition-all shadow-sm group ml-auto rtl:ml-0 rtl:mr-auto w-full sm:w-auto">
        <span>{{ i18n.translate('btnExplore3D') }}</span>
        <mat-icon class="text-sm group-hover:translate-x-0.5 rtl:group-hover:-translate-x-0.5 transition-transform">arrow_forward</mat-icon>
      </a>
    </div>
  }

</div>
