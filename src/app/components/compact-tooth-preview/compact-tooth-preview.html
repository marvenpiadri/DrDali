<div class="compact-preview-card">
  
  <!-- PREVIEW HEADER -->
  <div class="compact-preview-header">
    <div class="compact-preview-heading">
      <div class="compact-preview-copy">
        <h4 class="compact-preview-title">
          {{ localizedToothName() }}
        </h4>
        <p class="compact-preview-subtitle">
          {{ localizedArchName() }}
        </p>
      </div>
    </div>
  </div>

  <!-- TOOTH TYPES SELECTOR BAR (Incisives, Canines, Prémolaires, Molaires) -->
  <div class="compact-preview-selector">
    @for (preset of toothTypePresets; track preset.id) {
      <button
        type="button"
        (click)="selectTooth(preset.fdi)"
        class="tooth-preset-button"
        [class.is-active]="currentFdi() === preset.fdi"
        
        
        
        
        
        >
        {{ i18n.translate(preset.labelKey) }}
      </button>
    }
  </div>

  <!-- 3D VIEWPORT CONTAINER -->
  <div class="compact-preview-viewport">
    
    <app-dental-3d-viewport
      #viewport
      modelType="tooth-explorer"
      [activeMode]="activeMode()"
      [selectedToothFdi]="currentFdi()"
      [showControls]="false"
      class="compact-preview-engine">
    </app-dental-3d-viewport>

    <!-- Small rounded buttons in bottom right -->
    <div class="compact-preview-controls">
      <button
        type="button"
        (click)="toggleAutoRotate()"
        [class.is-active]="isAutoRotating()"
        
        
        
        
        class="preview-icon-button"
        [title]="i18n.translate('autoRotateToggle')">
        <i class="fa-solid fa-rotate preview-icon" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        (click)="resetCamera()"
        class="preview-icon-button"
        [title]="i18n.translate('recenterView')">
        <i class="fa-solid fa-crosshairs preview-icon" aria-hidden="true"></i>
      </button>
    </div>

  </div>

  <!-- VIEWING MODE TOGGLE BUTTONS -->
  <div class="compact-preview-modes">
    @for (mode of viewModes; track mode.id) {
      <button
        type="button"
        (click)="setViewMode(mode.id)"
        class="preview-mode-button"
        [class.is-active]="activeMode() === mode.id"
        
        
        
        
        
        >
        {{ mode.label }}
      </button>
    }
  </div>

  <!-- FOOTER / CTA -->
  @if (showDetailsCta()) {
    <div class="compact-preview-footer">
      <div class="compact-preview-footer-note">
        {{ i18n.translate('atlasTitle') }}
      </div>

      <a
        [routerLink]="ctaLink()"
        [queryParams]="{ fdi: currentFdi(), tooth: currentFdi() }"
        class="compact-preview-cta">
        <span>{{ i18n.translate('btnExplore3D') }}</span>
        <i class="fa-solid fa-arrow-right compact-preview-cta-icon" aria-hidden="true"></i>
      </a>
    </div>
  }

</div>
