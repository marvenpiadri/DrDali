<div 
  class="modal-backdrop animate-fade-in"
  (click)="onBackdropClick($event)"
  (keydown.escape)="closeModal.emit()"
  tabindex="-1"
  role="dialog" 
  aria-modal="true"
  aria-labelledby="whatsapp-modal-title">
  
  <div 
    id="whatsapp-modal-container"
    class="modal-dialog bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 p-6 sm:p-8 relative text-left rtl:text-right">
    
    <!-- Header -->
    <div class="flex items-start justify-between pb-5 border-b border-neutral-100 dark:border-neutral-800">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="text-xs font-semibold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">
            {{ 'directWhatsApp' | translate }}
          </span>
        </div>
        <h2 id="whatsapp-modal-title" class="text-xl font-bold tracking-tight text-neutral-900 dark:text-white">
          {{ 'brandName' | translate }}
        </h2>
        <p class="text-xs sm:text-sm text-neutral-500 dark:text-neutral-400 mt-1">
          {{ 'clinicSubtitle' | translate }}
        </p>
      </div>
      <button 
        type="button" 
        (click)="closeModal.emit()"
        class="close-btn hover:bg-neutral-100 dark:hover:bg-neutral-800 text-neutral-400 hover:text-neutral-900 dark:hover:text-white cursor-pointer"
        [attr.aria-label]="'ariaCloseMenu' | translate">
        <span class="material-icons text-xl">close</span>
      </button>
    </div>

    <!-- Form -->
    <form [formGroup]="contactForm" (ngSubmit)="sendWhatsApp()" class="mt-6 space-y-4">
      
      <!-- Praticien Souhaité -->
      <div>
        <label for="modal-doctor-select" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">
          {{ 'selectDoctor' | translate }}
        </label>
        <select 
          id="modal-doctor-select"
          formControlName="preferredDoctor"
          class="w-full bg-neutral-50 dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-colors">
          <option value="">{{ 'anyDoctorOption' | translate }}</option>
          <option value="Dr. Youssef Dali">Dr. Youssef Dali ({{ 'doctorYoussefSpecialty' | translate }})</option>
          <option value="Dr. Kenza Dali">Dr. Kenza Dali ({{ 'doctorKenzaSpecialty' | translate }})</option>
        </select>
      </div>

      <!-- Motif -->
      <div>
        <label for="modal-reason-select" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">
          {{ 'reasonForConsultation' | translate }} *
        </label>
        <select 
          id="modal-reason-select"
          formControlName="reasonId"
          class="w-full bg-neutral-50 dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-colors">
          @for (reason of clinic.consultationReasons; track reason.id) {
            <option [value]="reason.id">
              {{ reason.label }}
            </option>
          }
        </select>
      </div>

      <!-- Nom du patient -->
      <div>
        <label for="modal-patient-name" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">
          {{ 'patientFullName' | translate }}
        </label>
        <input 
          id="modal-patient-name"
          type="text" 
          formControlName="patientName"
          [placeholder]="'patientNamePlaceholder' | translate"
          class="w-full bg-neutral-50 dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-colors" />
      </div>

      <!-- Précisions -->
      <div>
        <label for="modal-custom-note" class="block text-xs font-semibold uppercase tracking-wider text-neutral-600 dark:text-neutral-400 mb-2">
          {{ 'symptomsNoteOptional' | translate }}
        </label>
        <textarea 
          id="modal-custom-note"
          rows="2"
          formControlName="customNote"
          [placeholder]="'symptomsNotePlaceholder' | translate"
          class="w-full bg-neutral-50 dark:bg-neutral-950 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-neutral-900 dark:focus:ring-white transition-colors resize-none"></textarea>
      </div>

      <!-- Action -->
      <div class="pt-3">
        <button 
          type="submit"
          class="w-full h-12 py-3 px-6 flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-bold text-xs uppercase tracking-wider rounded-xl transition-all shadow-md cursor-pointer">
          <app-whatsapp-icon [size]="20" extraClass="text-white" />
          <span>{{ 'btnOpenWhatsApp' | translate }}</span>
        </button>
      </div>

      <p class="text-[11px] text-center text-neutral-400 dark:text-neutral-400 pt-1">
        {{ 'whatsAppAutoFormatNotice' | translate }}
      </p>
    </form>

  </div>
</div>
