<div
  class="dental-loader-container"
  [class.overlay-mode]="overlay()"
  [class.size-sm]="size() === 'sm'"
  [class.size-md]="size() === 'md'"
  [class.size-lg]="size() === 'lg'">

  <div class="loader-content">
    <div class="loader-graphic">
      <div class="loader-glow" aria-hidden="true"></div>
      <div class="circle-spinner" aria-hidden="true"></div>
      <div class="loader-center" aria-hidden="true">
        <svg class="star-light-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" />
        </svg>
      </div>
    </div>

    @if (message()) {
      <div class="loader-message">{{ message() }}</div>
    }
  </div>
</div>
