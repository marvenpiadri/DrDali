<div class="slider-container">
  <div class="doctor-slider-toolbar">
    <span class="doctor-slider-count">Praticien {{ currentIndex() + 1 }} / {{ doctors.length }}</span>
    <div class="doctor-slider-navigation">
      <button type="button" (click)="prevSlide()" class="nav-button" aria-label="Praticien précédent">
        <span class="material-icons" aria-hidden="true">arrow_back</span>
      </button>
      <button type="button" (click)="nextSlide()" class="nav-button" aria-label="Praticien suivant">
        <span class="material-icons" aria-hidden="true">arrow_forward</span>
      </button>
    </div>
  </div>

  <div class="doctor-slider-surface">
    <div class="slide-wrapper" [style.transform]="'translateX(' + (i18n.isRtl() ? '' : '-') + (currentIndex() * 100) + '%)'">
      @for (doc of doctors; track doc.id) {
        <article class="slide-card">
          <div class="doctor-slide-grid">
            <div class="doctor-portrait" aria-hidden="true"></div>
            <div class="doctor-information-card">
              <span class="doctor-kicker">Notre équipe</span>
              <h3 class="doctor-name">{{ doc.name }}</h3>
            </div>
          </div>
        </article>
      }
    </div>
  </div>

  <div class="doctor-slider-pagination" aria-label="Navigation des praticiens">
    @for (doc of doctors; track doc.id; let i = $index) {
      <button
        type="button"
        (click)="goToSlide(i)"
        class="dot-indicator"
        [class.is-current]="currentIndex() === i"
        [attr.aria-label]="'Aller au médecin ' + (i + 1)"
        [attr.aria-current]="currentIndex() === i ? 'true' : null">
      </button>
    }
  </div>
</div>
