<div class="clinic-map-card">
  <header class="clinic-map-header">
    <div class="clinic-map-heading">
      <div class="clinic-map-status-row">
        @if (clinic.isClinicOpenNow()) {
          <span class="clinic-status clinic-status-open">
            <span class="clinic-status-dot" aria-hidden="true"></span>
            Ouvert Actuellement
          </span>
        } @else {
          <span class="clinic-status clinic-status-closed">
            <span class="clinic-status-dot" aria-hidden="true"></span>
            Fermé Actuellement (Réouverture à 09h00)
          </span>
        }
      </div>
      <h3 class="clinic-map-title">Centre Dentaire Dali</h3>
    </div>

    <nav class="clinic-map-actions" aria-label="Options d’itinéraire">
      <a
        [href]="googleMapsDirectionsUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="action-btn clinic-map-action clinic-map-action-primary">
        <span class="material-icons clinic-map-action-icon" aria-hidden="true">directions</span>
        <span>Itinéraire Google Maps</span>
      </a>

      <a
        [href]="wazeDirectionsUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="action-btn clinic-map-action clinic-map-action-secondary">
        <span class="material-icons clinic-map-action-icon" aria-hidden="true">navigation</span>
        <span>Waze</span>
      </a>
    </nav>
  </header>

  <div class="map-frame-wrapper">
    <div #mapElement class="clinic-map-canvas"></div>


  </div>

  <footer class="clinic-map-footer">
    <div class="clinic-map-features">
      <div class="clinic-map-feature">
        <span class="material-icons clinic-map-feature-icon clinic-map-parking-icon" aria-hidden="true">local_parking</span>
        <span>Parking gratuit à proximité</span>
      </div>
      <div class="clinic-map-feature">
        <span class="material-icons clinic-map-feature-icon clinic-map-access-icon" aria-hidden="true">accessible</span>
        <span>Accès PMR complet</span>
      </div>
    </div>

    <div class="clinic-map-address">
      Face à la Pharmacie Hassan II, Témara
    </div>
  </footer>
</div>
