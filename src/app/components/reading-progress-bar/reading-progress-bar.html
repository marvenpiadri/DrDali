<!-- TOP SUBTLE READING PROGRESS BAR -->
<div 
  class="reading-progress-track"
  [class.is-hidden]="!isVisible()"
  [class.is-visible]="isVisible()">
  <div 
    class="reading-progress-fill"
    [style.width.%]="progress()">
  </div>
</div>

<!-- FLOATING READING BADGE & BACK TO TOP BUTTON -->
@if (isVisible() && isArticleRoute()) {
  <div class="reading-progress-floating animate-fade-in">
    <!-- Progress Pill -->
    <div class="reading-progress-badge">
      <span class="reading-progress-dot"></span>
      <span>{{ progress() }}%</span>
    </div>

    <!-- Back to Top Button -->
    <button
      type="button"
      (click)="scrollToTop()"
      class="reading-progress-top-button"
      [attr.aria-label]="'scrollToTop' | translate"
      [attr.title]="'scrollToTop' | translate">
      <span class="material-icons reading-progress-top-icon">arrow_upward</span>
    </button>
  </div>
}
